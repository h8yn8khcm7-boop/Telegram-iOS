name: ios-ipa
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.sha }}
          restore-keys: bazel-
      - name: Config
        run: |
          cp build-system/appstore-configuration.json cfg.json
          python3 - <<'EOF'
          import json,os
          c=json.load(open('cfg.json'))
          c['api_id']=os.environ['API_ID']
          c['api_hash']=os.environ['API_HASH']
          c['sg_config']=""
          json.dump(c,open('cfg.json','w'),indent=2)
          EOF
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
      - name: Build
        shell: bash
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" build \
            --configurationPath=cfg.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=1 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -n -E "ERROR|error:|Error" build.log | head -30 || true
      - name: Collect
        run: |
